name: Deploy to Namecheap Shared Hosting (SSH / Rsync)

on:
  push:
    branches:
      - main
  workflow_dispatch: # يتيح تشغيل النشر يدوياً من واجهة GitHub Actions

jobs:
  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      # 1. التحقق من وجود جميع المتغيرات السرية المطلوبة قبل بدء البناء
      - name: Validate Required Secrets
        run: |
          MISSING=""
          if [ -z "${{ secrets.SSH_HOST }}" ]; then MISSING="$MISSING SSH_HOST"; fi
          if [ -z "${{ secrets.SSH_USER }}" ]; then MISSING="$MISSING SSH_USER"; fi
          if [ -z "${{ secrets.SSH_PRIVATE_KEY }}" ]; then MISSING="$MISSING SSH_PRIVATE_KEY"; fi
          if [ -z "${{ secrets.DEPLOY_PATH }}" ]; then MISSING="$MISSING DEPLOY_PATH"; fi

          if [ -n "$MISSING" ]; then
            echo "::error title=Missing Secrets::المتغيرات السرية التالية مفقودة أو فارغة في GitHub Repository Secrets:$MISSING"
            echo "يرجى الذهاب إلى مستودع GitHub:"
            echo "Settings -> Secrets and variables -> Actions -> قسم 'Repository secrets'"
            echo "وتأكد من إضافة المتغيرات بالأسماء الصحيحة وبحروف كبيرة (Capital):"
            echo "1. SSH_HOST (عنوان IP السيرفر أو النطاق)"
            echo "2. SSH_USER (اسم مستخدم cPanel)"
            echo "3. SSH_PRIVATE_KEY (المفتاح الخاص)"
            echo "4. DEPLOY_PATH (المسار الكامل مثل /home/username/baba-albustan-keys)"
            exit 1
          fi

      # 2. جلب الكود من المستودع
      - name: Checkout Code
        uses: actions/checkout@v4

      # 3. إعداد بيئة PHP 8.3 مع الامتدادات اللازمة
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_mysql, pdo_sqlite, bcmath, curl, zip
          coverage: none

      # 4. تثبيت حزم Composer للإنتاج بدون حزم التطوير
      - name: Install Composer Dependencies
        run: |
          composer install --no-dev --prefer-dist --optimize-autoloader --no-progress --no-interaction

      # 5. إعداد بيئة Node.js 20
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # 6. تثبيت حزم NPM وبناء ملفات الواجهة (Vite / Tailwind)
      - name: Install NPM Dependencies & Build Assets
        run: |
          npm ci
          npm run build

      # 7. إعداد مفتاح SSH والاتصال بسيرفر Namecheap (المنفذ الافتراضي 21098)
      - name: Configure SSH Key & Host
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT || '21098' }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      # 8. مزامنة ونقل الملفات عبر Rsync مع استثناء الملفات الحساسة
      - name: Sync Files via Rsync
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || '21098' }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          rsync -avz --delete \
            -e "ssh -p $SSH_PORT -o StrictHostKeyChecking=no" \
            --exclude='.env' \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='node_modules/' \
            --exclude='storage/app/public/*' \
            --exclude='storage/framework/sessions/*' \
            --exclude='storage/framework/views/*' \
            --exclude='storage/logs/*' \
            --exclude='database/database.sqlite' \
            ./ "$SSH_USER@$SSH_HOST:$DEPLOY_PATH"

      # 9. تنفيذ أوامر الصيانة والتحديث على سيرفر الاستضافة
      - name: Execute Remote Post-Deployment Tasks
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || '21098' }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          PHP_CMD: ${{ secrets.PHP_BIN || 'php' }}
        run: |
          ssh -p "$SSH_PORT" -o StrictHostKeyChecking=no "$SSH_USER@$SSH_HOST" << EOF
            set -e
            cd "$DEPLOY_PATH"

            # ضبط الصلاحيات للمجلدات القابلة للكتابة
            chmod -R 775 storage bootstrap/cache

            # ربط التخزين العام
            $PHP_CMD artisan storage:link --force || true

            # تشغيل الترحيلات
            $PHP_CMD artisan migrate --force

            # تحسين الأداء ومسح وتحديث الكاش للإنتاج
            $PHP_CMD artisan optimize:clear
            $PHP_CMD artisan config:cache
            $PHP_CMD artisan route:cache
            $PHP_CMD artisan view:cache
          EOF
